spring.application.name=BackEnd
spring.profiles.active=local
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:QLBanMayTinh};encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Giu ket noi DB am ? tranh timeout hoac ngat ket noi am tham gay cham request dau tien
spring.datasource.hikari.keepalive-time=180000
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Doi tu none thanh update de Hibernate tu dong cap nhat cot ma_san_pham va barcode vao SQL Server
spring.jpa.hibernate.ddl-auto=none

# Upload anh ? luu thang vao public/images cua frontend de Vite phuc vu ngay
upload.dir=${UPLOAD_DIR:../FrontEnd/QLBanMayTinh/public/images}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI/Swagger — đã gỡ khỏi pom.xml
# springdoc.api-docs.enabled=false
# springdoc.swagger-ui.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI Chatbot Configuration (Ollama)
ai.ollama.url=${OLLAMA_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:llama3.2}
ai.ollama.enabled=${OLLAMA_ENABLED:true}
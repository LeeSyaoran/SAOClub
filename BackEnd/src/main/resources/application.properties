spring.application.name=BackEnd
spring.profiles.active=local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QLBanMayTinh;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=vacx12345
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Giu ket noi DB am ? tranh timeout hoac ngat ket noi am tham gay cham request dau tien
spring.datasource.hikari.keepalive-time=180000
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Doi tu none thanh update de Hibernate tu dong cap nhat cot ma_san_pham va barcode vao SQL Server
spring.jpa.hibernate.ddl-auto=update

# Upload anh ? luu thang vao public/images cua frontend de Vite phuc vu ngay
upload.dir=../FrontEnd/QLBanMayTinh/public/images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.example.backend.controller

# JWT Configuration
jwt.secret=your-very-secure-and-long-secret-key-that-meets-the-signing-algorithm-requirements
jwt.expiration=86400000
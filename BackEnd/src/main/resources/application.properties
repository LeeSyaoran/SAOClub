spring.application.name=BackEnd
spring.profiles.active=local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QLBanMayTinh;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Giữ kết nối DB "ấm" — không phải data lớn làm chậm, mà là request đầu tiên sau
# một lúc rảnh bị chậm 15-25s do kết nối bị mạng/DB âm thầm đóng rồi phải bắt lại
# (bắt tay TLS lại từ đầu). Hikari tự ping định kỳ để giữ kết nối sống, tránh treo.
spring.datasource.hikari.keepalive-time=180000
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none

# Upload anh — luu thang vao public/images cua frontend de Vite phuc vu ngay
upload.dir=../FrontEnd/QLBanMayTinh/public/images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.example.backend.controller

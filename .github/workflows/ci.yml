name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FrontEnd/QLBanMayTinh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './FrontEnd/QLBanMayTinh/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FrontEnd/QLBanMayTinh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './FrontEnd/QLBanMayTinh/package-lock.json'
      - run: npm ci
      - run: npm run build

  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./BackEnd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      # BackEndApplicationTests la @SpringBootTest that (can ket noi DB thuc) — khong co
      # SQL Server trong CI nen loai rieng test nay. 130 test con lai la unit test Mockito
      # thuan tuy (khong dung DB) — chinh nhung test nay bao ve logic don hang/kho/tra hang.
      - run: mvn clean test -Dtest='!BackEndApplicationTests'

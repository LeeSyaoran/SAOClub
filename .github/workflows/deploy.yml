name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend
        working-directory: ./BackEnd
        # BackEndApplicationTests can DB thuc, khong co trong CI nen loai rieng no ra
        # (xem ci.yml) — cac test con lai PHAI qua thi moi duoc dong goi de deploy.
        run: mvn clean package -Dtest='!BackEndApplicationTests'

      - name: Build Frontend
        working-directory: ./FrontEnd/QLBanMayTinh
        run: |
          npm ci
          npm run build

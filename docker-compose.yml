version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file: .env
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./Database:/scripts
      - ./Database/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$SA_PASSWORD -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build: ./BackEnd
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: "http://backend:8080"
    volumes:
      - ./FrontEnd/QLBanMayTinh:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  sqlserver-data:

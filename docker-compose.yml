services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file: .env
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./Database:/scripts
      - ./Database/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$SA_PASSWORD -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Ollama AI ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU support (NVIDIA) — comment out nếu không có GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Tự động pull model llama3.2 khi lần đầu chạy
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "
        echo '>>> Checking model llama3.2...' &&
        ollama list | grep -q 'llama3.2' &&
        echo '>>> Model llama3.2 already exists, skipping pull.' ||
        (echo '>>> Pulling model llama3.2...' && ollama pull llama3.2 && echo '>>> Done.')
      "
    restart: "no"

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build: ./BackEnd
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: QLBanMayTinh
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
      # Kết nối Ollama (chạy trên host hoặc qua container)
      OLLAMA_URL: "http://host.docker.internal:11434"
    volumes:
      - ./FrontEnd/QLBanMayTinh/public/images:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: "http://backend:8080"
      VITE_API_URL: "http://localhost:8080"
    volumes:
      - ./FrontEnd/QLBanMayTinh:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  sqlserver-data:
  backend-uploads:
  ollama-data:

<!doctype html>
<!-- Khai báo ngôn ngữ tiếng Việt, bật dark mode của Bootstrap 5.3 -->
<html lang="vi" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Responsive cho mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAOClub - Hệ thống bán lẻ Laptop</title>
    <!-- Cho phép kết nối tới Firebase, Google APIs, Google Fonts. CSP này điều khiển dev (Vite dev server
         cũng gửi thêm header CSP, index.html là nguồn chính cho production build). -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' data: blob:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://accounts.google.com https://apis.google.com blob:;
      worker-src 'self' blob:;
      child-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: https: blob: https://*.googleusercontent.com;
      connect-src 'self' https://www.gstatic.com https://accounts.google.com https://apis.google.com https://oauth2.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://www.googleapis.com https://*.firebaseapp.com http://localhost:* ws://localhost:*;
      frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.googleusercontent.com https://identitytoolkit.googleapis.com;
    ">
    <!-- Rubik (tiêu đề, đậm/bold) + Nunito Sans (thân chữ) từ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Vue 3 sẽ mount vào đây -->
    <div id="app"></div>
    <!-- Entry point của Vite -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

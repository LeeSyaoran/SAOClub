<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" width="180" height="50">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D40F28"/>
      <stop offset="50%" style="stop-color:#E11D48"/>
      <stop offset="100%" style="stop-color:#F43F5E"/>
    </linearGradient>
  </defs>

  <!-- Circle background with gradient -->
  <circle cx="25" cy="25" r="20" fill="url(#grad1)"/>

  <!-- Stylized S letter -->
  <text x="25" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#fff">S</text>

  <!-- Text -->
  <text x="52" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">SAO</text>
  <text x="52" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="300" fill="#555">PHONE</text>

  <!-- Decorative line -->
  <rect x="52" y="27" width="100" height="1" fill="url(#grad1)" opacity="0.3"/>
</svg>

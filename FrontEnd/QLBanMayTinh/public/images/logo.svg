<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 45" width="180" height="45">
  <defs>
    <linearGradient id="yellow3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="80%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="pink3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="40%" stop-color="#DB2777"/>
      <stop offset="80%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <filter id="shadowY" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="1.5" flood-color="#854D0E" flood-opacity="0.7"/>
    </filter>
    <filter id="shadowP" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="1.5" flood-color="#500724" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- SAO + CLUB liền nhau -->
  <text x="90" y="35" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" letter-spacing="0">
    <tspan fill="url(#yellow3d)" filter="url(#shadowY)">SAO</tspan><tspan fill="url(#pink3d)" filter="url(#shadowP)">CLUB</tspan>
  </text>
</svg>
